openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: reviews
    description: Private customer review submissions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /reviews:
    post:
      operationId: submitReview
      tags: [reviews]
      summary: Email a customer review to the owner for manual approval
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewSubmission"
      responses:
        "200":
          description: Review email accepted for delivery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewSubmissionResult"
        "400":
          description: Invalid review
        "429":
          description: Too many review submissions
        "502":
          description: Email delivery failed
        "503":
          description: Email service is not configured
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ReviewSubmission:
      type: object
      additionalProperties: false
      required: [name, rating, review]
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 100
        rating:
          type: integer
          minimum: 1
          maximum: 5
        review:
          type: string
          minLength: 15
          maxLength: 2000
        email:
          type: string
          format: email
          maxLength: 254
    ReviewSubmissionResult:
      type: object
      required: [message]
      properties:
        message:
          type: string

